---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tracing
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: tempo
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: tempo
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 0
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: tempo-values
      valuesKey: values.yaml
