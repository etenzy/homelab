# Existing monitor retained for a component without a chart-provided monitor.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet-serving-cert-approver
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kubelet-serving-cert-approver
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet-serving-cert-approver
  endpoints:
    - port: metrics
      path: /metrics
      # Match the monitor example in the approver's pinned upstream deploy guide.
      interval: 60s
      scrapeTimeout: 10s
