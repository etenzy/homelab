# Generated wildcard certificate from cluster.ingress.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-gateway-tls
  namespace: ingress
spec:
  secretName: homelab-gateway-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - k8s.home.rdl.sh
    - '*.k8s.home.rdl.sh'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
