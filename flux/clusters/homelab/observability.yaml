# Independent log and trace pipelines; neither gates core monitoring.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: ./flux/infrastructure/loki
  prune: false
  dependsOn:
    - name: cilium
    - name: storage-classes
    - name: prometheus-operator-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: logging
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: ./flux/infrastructure/vector
  prune: false
  dependsOn:
    - name: loki
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vector
      namespace: logging
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: ./flux/infrastructure/tempo
  prune: false
  dependsOn:
    - name: cilium
    - name: storage-classes
    - name: prometheus-operator-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tempo
      namespace: tracing
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: ./flux/infrastructure/otel-collector
  prune: false
  dependsOn:
    - name: tempo
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: otel-collector
      namespace: tracing
