---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  timeout: 25m
  path: ./flux/observability
  prune: false
  dependsOn:
    - name: kube-infra
    - name: kube-infra-addons
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: otel-collector
      namespace: tracing
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tempo
      namespace: tracing
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vector
      namespace: logging
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: logging
  decryption:
    provider: sops
    secretRef:
      name: sops-age
