# CRD-only release: no CNI, monitoring workloads or storage dependencies.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/prometheus-operator-crds
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-operator-crds
      namespace: kube-system
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: servicemonitors.monitoring.coreos.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: podmonitors.monitoring.coreos.com
---
# Cilium is initially installed with Helm, then managed by this same release.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/cilium
  # Preserve the CNI if its files are accidentally removed from Git.
  prune: false
  dependsOn:
    - name: prometheus-operator-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-bgp
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/cilium-bgp
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-namespaces
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/infrastructure/storage-namespaces
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/flux-operator
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flux-operator
      namespace: flux-system
---
# Keep the certificate approver independent of metrics-server readiness.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/kubelet-serving-cert-approver
  # Preserve certificate renewal if this directory is accidentally removed.
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kubelet-serving-cert-approver
      namespace: kubelet-serving-cert-approver
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/metrics-server
  prune: true
  dependsOn:
    - name: cilium
    - name: kubelet-serving-cert-approver
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/cert-manager
  # Preserve the certificate controllers and CRDs after accidental Git removal.
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/cert-manager-issuers
  prune: false
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  # ACME readiness must not gate the internal metrics-server certificate.
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-certificates
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  path: ./flux/infrastructure/gateway-certificates
  prune: false
  dependsOn:
    - name: cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: homelab-gateway-tls
      namespace: ingress
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/cilium-gateway
  prune: false
  dependsOn:
    - name: cilium
    - name: cilium-bgp
    - name: gateway-certificates
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: homelab-cilium
      namespace: ingress
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: >-
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Programmed' && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: ./flux/infrastructure/kube-prometheus-stack
  prune: false
  dependsOn:
    - name: cilium
    - name: cert-manager
    - name: kubelet-serving-cert-approver
    - name: storage-namespaces
    - name: storage-classes
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-extras
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/monitoring-extras
  prune: true
  dependsOn:
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
