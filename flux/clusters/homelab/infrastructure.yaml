---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/cilium
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-bgp
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/cilium-bgp
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-namespaces
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/infrastructure/storage-namespaces
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/flux-operator
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flux-operator
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/kubelet-serving-cert-approver
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kubelet-serving-cert-approver
      namespace: kubelet-serving-cert-approver
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/metrics-server
  prune: true
  dependsOn:
    - name: cilium
    - name: kubelet-serving-cert-approver
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/cert-manager
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/cert-manager-issuers
  prune: false
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/envoy-gateway
  prune: false
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: envoy-gateway-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/envoy-gateway-config
  prune: false
  dependsOn:
    - name: envoy-gateway
    - name: cilium-bgp
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-listeners
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  timeout: 10m
  path: ./flux/infrastructure/envoy-gateway-listeners
  prune: false
  dependsOn:
    - name: envoy-gateway-config
    - name: cert-manager-issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: homelab-gateway-tls
      namespace: ingress
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: ./flux/infrastructure/kube-prometheus-stack
  prune: false
  dependsOn:
    - name: cilium
    - name: cert-manager
    - name: kubelet-serving-cert-approver
    - name: storage-namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-extras
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./flux/infrastructure/monitoring-extras
  prune: true
  dependsOn:
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
