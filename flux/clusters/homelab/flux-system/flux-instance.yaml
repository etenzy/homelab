---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: 2.10.0
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    url: ssh://git@github.com/etenzy/homelab
    ref: refs/heads/main
    path: flux/clusters/homelab
    pullSecret: flux-system
    interval: 1m
  kustomize:
    patches:
      - target:
          kind: Deployment
        patch: |-
          - op: add
            path: /spec/template/spec/tolerations
            value:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
