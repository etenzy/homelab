apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openebs-lvm
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  path: ./flux/infrastructure/openebs-lvm
  # Preserve the storage driver and its CRDs after accidental Git removal.
  prune: false
  dependsOn:
    - name: cilium
    - name: storage-namespaces
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openebs-lvm
      namespace: openebs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-classes
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/infrastructure/storage-classes
  # Keep the local-volume policy if this component is removed from Git.
  prune: false
  dependsOn:
    - name: openebs-lvm
  sourceRef:
    kind: GitRepository
    name: flux-system

