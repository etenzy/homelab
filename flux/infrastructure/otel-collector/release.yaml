---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: tracing
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.178.3
      sourceRef:
        kind: HelmRepository
        name: otel-collector
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 0
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
    - name: tempo
      namespace: tracing
  valuesFrom:
    - kind: ConfigMap
      name: otel-collector-values
      valuesKey: values.yaml
