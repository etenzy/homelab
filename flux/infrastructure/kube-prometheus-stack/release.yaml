apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    disableTakeOwnership: false
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    # Adopt the previously Flux-owned Grafana route and ListenerSet.
    disableTakeOwnership: false
    crds: Skip
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
