apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter needs host networking/PID and read-only host filesystem mounts.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    k8s.rdl.sh/gateway-access: "true"
