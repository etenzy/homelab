apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-cilium
  namespace: ingress
spec:
  gatewayClassName: homelab-cilium
  infrastructure:
    # Inherited by Cilium's generated Service: select the existing IPAM/BGP policies.
    labels:
      network.k8s.rdl.sh/bgp: "true"
  # Delegate application TLS listeners to explicitly enabled namespaces.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          k8s.rdl.sh/gateway-access: "true"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    - name: https
      port: 443
      protocol: HTTPS
      # No hostname: this is the shared default TLS listener for other services.
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: homelab-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              k8s.rdl.sh/gateway-access: "true"
        kinds:
          - kind: HTTPRoute
