apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: hubble-dns-visibility
spec:
  description: Observe cluster DNS from explicitly opted-in application namespaces.
  endpointSelector:
    matchLabels:
      # Cilium propagates Namespace labels into endpoint identity labels.
      k8s:io.cilium.k8s.namespace.labels.k8s.rdl.sh/dns-visibility: "true"
    matchExpressions:
      # Keep cluster DNS and other system Pods out of this opt-in policy.
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
      - key: k8s:k8s-app
        operator: NotIn
        values:
          - kube-dns
  # Selecting a Pod must not itself activate L3/L4 default-deny enforcement.
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            # Allow every DNS name on the intercepted path.
            dns:
              - matchPattern: "*"
