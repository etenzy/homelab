# Flux Operator chart 0.62.1: require a control-plane Pi selected by Talos labels.
nodeSelector:
  k8s.rdl.sh/node-class: controlplane-pi
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
# Run the operator without the optional web UI.
web:
  enabled: false
# GitOps HelmRelease waits for monitoring CRDs before enabling this monitor.
serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack
  interval: 30s
  scrapeTimeout: 10s
