---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-dashboard-flux-performance
    namespace: flux-system
    files:
      - flux-performance.json
    options:
      labels:
        grafana_dashboard: '1'
        app.kubernetes.io/part-of: homelab-monitoring
      annotations:
        grafana_folder: /tmp/dashboards/Flux
  - name: grafana-dashboard-flux-k8s-api-performance
    namespace: flux-system
    files:
      - flux-k8s-api-performance.json
    options:
      labels:
        grafana_dashboard: '1'
        app.kubernetes.io/part-of: homelab-monitoring
      annotations:
        grafana_folder: /tmp/dashboards/Flux
