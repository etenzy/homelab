# Generated Grafana ListenerSet and certificate annotations from cluster.ingress.
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    cert-manager.io/duration: 2160h
    cert-manager.io/renew-before: 720h
    cert-manager.io/private-key-rotation-policy: Always
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-cilium
    namespace: ingress
  listeners:
    - name: https
      hostname: grafana.k8s.home.rdl.sh
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: grafana-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
