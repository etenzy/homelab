# CRDs are owned by the separate, readiness-gated CRD HelmRelease.
deployment:
  replicas: 1
  pod:
    nodeSelector:
      k8s.rdl.sh/node-class: worker-pi
    tolerations: []
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1024Mi
certgen:
  # Keep the upstream hook: it also prepares material required by OIDC.
  job:
    nodeSelector:
      k8s.rdl.sh/node-class: worker-pi
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
service:
  # This is the controller's internal service, not the public data plane.
  type: ClusterIP
hpa:
  enabled: false
