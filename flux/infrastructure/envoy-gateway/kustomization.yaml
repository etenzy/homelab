apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - crds-release.yaml
  - release.yaml
configMapGenerator:
  - name: envoy-gateway-crds-values
    namespace: envoy-gateway-system
    files:
      - values.yaml=crds-values.yaml
  - name: envoy-gateway-values
    namespace: envoy-gateway-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
