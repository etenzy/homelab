apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
  namespace: envoy-gateway-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: envoy-gateway-crds
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-crds-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              version: v1
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: retained-crd
                annotations:
                  helm.sh/resource-policy: keep
