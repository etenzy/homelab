apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: envoy-gateway
      version: 1.10.0
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  dependsOn:
    - name: envoy-gateway-crds
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-values
      valuesKey: values.yaml
