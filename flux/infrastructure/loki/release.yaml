---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: 21.2.1
      sourceRef:
        kind: HelmRepository
        name: loki
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 0
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
