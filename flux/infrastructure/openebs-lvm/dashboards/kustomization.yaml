---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-dashboard-lvmlocalpv-pool
    namespace: openebs
    files:
      - lvmlocalpv-pool.json
    options:
      labels:
        grafana_dashboard: '1'
        app.kubernetes.io/part-of: homelab-monitoring
      annotations:
        grafana_folder: /tmp/dashboards/OpenEBS
