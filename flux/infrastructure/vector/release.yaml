---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: logging
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: vector
      version: 0.61.0
      sourceRef:
        kind: HelmRepository
        name: vector
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 0
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
    - name: loki
      namespace: logging
  valuesFrom:
    - kind: ConfigMap
      name: vector-values
      valuesKey: values.yaml
