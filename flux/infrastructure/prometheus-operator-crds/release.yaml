apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: kube-system
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 33.0.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    # Transfer existing schemas from the former stack-managed CRD lifecycle.
    disableTakeOwnership: false
    remediation:
      retries: 0
  upgrade:
    disableTakeOwnership: false
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-operator-crds-values
      valuesKey: values.yaml
