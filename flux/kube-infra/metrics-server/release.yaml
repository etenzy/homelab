apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    # Adopt the previous central ServiceMonitor if it already exists.
    disableTakeOwnership: false
    remediation:
      retries: 0
  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager
    - name: prometheus-operator-crds
      namespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: metrics-server-values
      valuesKey: values.yaml
