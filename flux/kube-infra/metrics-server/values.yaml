# One cluster-wide collector; it scrapes control-plane and worker kubelets.
replicas: 1
nodeSelector:
  k8s.rdl.sh/node-class: worker-pi
tolerations: []
resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 512Mi

defaultArgs:
  - --cert-dir=/tmp
  # Use stable node identities rather than dynamic GUA addresses or external DNS.
  - --kubelet-preferred-address-types=InternalIP
  - --kubelet-use-node-status-port
  - --metric-resolution=15s
args:
  # The approver enables cluster-CA-signed kubelet serving certificates.
  - --kubelet-certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

# Verify the API aggregation connection as well as the kubelet scrape connection.
apiService:
  insecureSkipTLSVerify: false
tls:
  # Internal service DNS names use the chart's dedicated SelfSigned Issuer.
  type: cert-manager
  certManager:
    addInjectorAnnotations: true
    existingIssuer:
      enabled: false
    duration: 2160h
    renewBefore: 720h

service:
  type: ClusterIP
hostNetwork:
  enabled: false
metrics:
  # The native chart permits metric scrapes on its cluster-internal HTTPS port.
  enabled: true
serviceMonitor:
  # Retain the chart's insecureSkipVerify setting for this metrics endpoint.
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
  scrapeTimeout: 10s
addonResizer:
  enabled: false
