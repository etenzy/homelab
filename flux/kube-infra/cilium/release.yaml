apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  timeout: 10m
  # Match the initial Helm release and its storage namespace for adoption.
  chart:
    spec:
      chart: cilium
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  # Avoid automatic uninstall/reinstall of the cluster CNI on a failed upgrade.
  upgrade:
    remediation:
      retries: 0
  dependsOn:
    - name: prometheus-operator-crds
      namespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
