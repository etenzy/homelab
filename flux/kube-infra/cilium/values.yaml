# Generated GitOps Cilium values; monitors require the early CRD release.
---
MTU: 9000
ipv4:
  enabled: true
ipv6:
  enabled: true
underlayProtocol: ipv4
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
routingMode: tunnel
tunnelProtocol: vxlan
enableIPv4Masquerade: true
enableMasqueradeRouteSource: false
rollOutCiliumPods: true
l7Proxy: true
envoy:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
prometheus:
  enabled: true
  metricsService: true
  metrics:
    - +cilium_bpf_syscall_duration_seconds
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
dashboards:
  enabled: true
  annotations:
    grafana_folder: /tmp/dashboards/Cilium
gatewayAPI:
  enabled: true
  gatewayClass:
    create: false
  hostNetwork:
    enabled: false
  secretsNamespace:
    create: true
    name: cilium-secrets
    sync: true
bgpControlPlane:
  enabled: true
l2announcements:
  enabled: false
operator:
  replicas: 2
  rollOutPods: true
  dashboards:
    enabled: true
    annotations:
      grafana_folder: /tmp/dashboards/Cilium
  prometheus:
    enabled: true
    metricsService: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: helm
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
    replicas: 1
    nodeSelector:
      k8s.rdl.sh/node-class: worker-pi
    tolerations: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    service:
      type: ClusterIP
  ui:
    enabled: true
    replicas: 1
    nodeSelector:
      k8s.rdl.sh/node-class: worker-pi
    tolerations: []
    backend:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
    frontend:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 128Mi
    service:
      type: ClusterIP
    ingress:
      enabled: false
  metrics:
    enabled:
      - dns:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - drop:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - tcp
      - flow:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,destination_namespace
      - port-distribution
      - icmp
      - httpV2:sourceContext=workload-name;destinationContext=workload-name;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
    dashboards:
      enabled: true
      annotations:
        grafana_folder: /tmp/dashboards/Hubble
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
  export:
    static:
      enabled: false
    dynamic:
      enabled: false
k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true
ipv6NativeRoutingCIDR: fd00:10:244::/56
enableIPv6Masquerade: true
bpf:
  masquerade: false
