[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
# Facts only via ansible_facts[...]; silences the INJECT_FACTS_AS_VARS deprecation
inject_facts_as_vars = False
# vault_password_file = ~/.config/ansible/homelab.vault

[ssh_connection]
pipelining = True
