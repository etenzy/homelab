---
# Homelab inventory. A host gets roles through its group memberships (see site.yml).
# ansible_host and ansible_user come from group_vars/all/vars.yml
# (<name>.home.rdl.sh, admin user), so a host name is usually enough here.
all:
  children:
    # base + admin: Debian, admin user, sudo, sshd hardening, timesyncd client (not on chrony_servers)
    # Hosts here that are not in docker_hosts get node_exporter as a binary.
    debian_hosts:
      hosts:
        mars:
        sun:
        # earth:   # not managed yet (Debian, Legacy BIOS); add once the roles were checked there

    # docker + monitoring (node_exporter, nvidia exporter on GPU hosts) as containers
    docker_hosts:
      hosts:
        mars:

    # nvidia: driver, persistenced, container toolkit
    gpu_hosts:
      hosts:
        mars:

    # traefik: reverse proxy, one Let's Encrypt certificate per host name
    traefik_hosts:
      hosts:
        mars:

    # jellyfin: NAS mounts + Jellyfin + jellyfin-exporter (needs docker_hosts and traefik_hosts)
    jellyfin_hosts:
      hosts:
        mars:

    # chrony_server: NTP server with NTS upstreams + chrony_exporter
    chrony_servers:
      hosts:
        sun:

    # blocky: DNS (binary), query log maintenance timers
    blocky_hosts:
      hosts:
        sun:

    # postgresql: PGDG PostgreSQL, login roles, postgres_exporter
    postgresql_hosts:
      hosts:
        sun:

    # valkey: Valkey + redis_exporter
    valkey_hosts:
      hosts:
        sun:

    # unifi: UniFi console managed through the official Integration API, run on the
    # controller (no SSH to the console). Not a Debian host.
    unifi_consoles:
      hosts:
        udm:
