---
# Homelab-wide settings. Role defaults (versions, technical defaults) live in
# roles/*/defaults/main.yml; override them here (all hosts), in group_vars/<group>/
# or in host_vars/<host>/. Secrets: vault.yml (template: vault.yml.example).

# --- Connection ----------------------------------------------------------------
home_domain: home.rdl.sh
ansible_host: "{{ inventory_hostname }}.{{ home_domain }}"
ansible_user: "{{ admin_user }}"

# Live config files fetched from the hosts (fetch-host-files.yml), used by roles
# whose configs are not templated (blocky, pg_hba, valkey).
host_files_dir: "{{ inventory_dir }}/../host_files/{{ inventory_hostname }}"
host_files_fetch: []

# --- Derived from group membership ---------------------------------------------
nvidia_enabled: "{{ 'gpu_hosts' in group_names }}"

# --- Base ----------------------------------------------------------------------
timezone: Europe/Berlin
ntp_servers: ["time.{{ home_domain }}"]   # timesyncd on clients; chrony on sun serves it

# --- Admin user, fish, sudo, SSH -----------------------------------------------
admin_user: mroedel
admin_ssh_keys:
  - https://github.com/etenzy.keys       # or keys as strings

# --- Derived from the host's own addresses (facts) -------------------------------
# IPv4: address of the default route interface. IPv6: the static ULA on that
# interface, recognised by a short interface ID ("fd..::2"); SLAAC (EUI-64) and
# privacy addresses are skipped, otherwise the first ULA is taken. Override
# host_ipv4 / host_ipv6 in host_vars if the guess is wrong.
host_iface: "{{ ansible_facts['default_ipv4']['interface'] | default('') }}"
host_ipv4: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
host_ipv6_ulas: >-
  {{ ansible_facts[host_iface | replace('-', '_')]['ipv6'] | default([])
     | selectattr('scope', 'eq', 'global') | map(attribute='address')
     | select('match', '^f[cd]') | list }}
host_ipv6: >-
  {{ (host_ipv6_ulas | select('match', '^[0-9a-f:]+::[0-9a-f]{1,4}$') | list + host_ipv6_ulas)
     | first | default('') }}
# Service addresses of this host (empty entries dropped). Used for PostgreSQL
# listen_addresses, chrony bindaddress and Valkey bind. Exporters listen on all
# addresses (:port), Blocky by default as well.
host_addresses: "{{ [host_ipv4, host_ipv6] | select | list }}"

# --- Networks ------------------------------------------------------------------
# Admin networks (VLAN 30 + VLAN 10), e.g. for dashboard allowlists.
admin_networks:
  - 10.73.30.0/24
  - fd00:10:73:30::/64
  - 10.73.10.0/24
  - fd00:10:73:10::/64

# --- Shared services -----------------------------------------------------------
prometheus_host: earth                   # scrapes the exporters over the network
nas_host: 10.73.10.2                     # Synology DS414
# CIFS credentials are NOT global: one NAS user per host and container, stored in
# host_vars/<host>/vault.yml as vault_<container>_cifs_user / _password.
