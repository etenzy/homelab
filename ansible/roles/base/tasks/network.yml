---
# Primary interface via systemd-networkd. The first switch from ifupdown runs
# detached and Ansible reconnects afterwards; ansible_host is a DNS name, so a
# changed static address must be in DNS first.
- name: Interface facts are usable
  ansible.builtin.assert:
    that:
      - network_interface | length > 0
      - ansible_facts[network_interface | replace('-', '_')]['macaddress'] is defined
      - network_ipv4 in ['dhcp', 'static']
      - network_ipv4 == 'dhcp' or (network_ipv4_address is search('/') and network_ipv4_gateway | length > 0)
      - network_ipv6_token | length == 0 or network_ipv6_slaac
    fail_msg: Check network_interface / network_ipv4* / network_ipv6_token (token needs network_ipv6_slaac).

- name: Network file for {{ network_interface }}
  ansible.builtin.template:
    src: network.j2
    dest: /etc/systemd/network/10-{{ network_interface }}.network
    mode: "0644"
  vars:
    network_mac: "{{ ansible_facts[network_interface | replace('-', '_')]['macaddress'] }}"
  register: network_file

- name: State of systemd-networkd before
  ansible.builtin.systemd_service:
    name: systemd-networkd
  register: network_networkd
  check_mode: false

- name: Keep only loopback in /etc/network/interfaces
  ansible.builtin.copy:
    dest: /etc/network/interfaces
    content: |
      # {{ ansible_managed }}
      # {{ network_interface }} is configured by systemd-networkd:
      # /etc/systemd/network/10-{{ network_interface }}.network
      source /etc/network/interfaces.d/*

      auto lo
      iface lo inet loopback
    mode: "0644"
    backup: true
  register: network_interfaces

- name: Enable systemd-networkd
  ansible.builtin.systemd_service:
    name: systemd-networkd
    enabled: true

# First switch: take the interface away from ifupdown and hand it to networkd in
# one detached step, so the SSH session can drop without stopping it halfway.
- name: Hand the interface to systemd-networkd
  ansible.builtin.shell: |
    set -u
    ifdown --force {{ network_interface }} || true
    pkill -f "dhclient.*{{ network_interface }}" || true
    ip address flush dev {{ network_interface }} scope global
    systemctl restart systemd-networkd
  async: 60
  poll: 0
  changed_when: true
  when:
    - not ansible_check_mode
    - network_networkd.status.ActiveState != 'active' or network_interfaces is changed

# Later changes: reload and reconfigure only this link.
- name: Apply changed network file
  ansible.builtin.shell: networkctl reload && networkctl reconfigure {{ network_interface }}
  async: 60
  poll: 0
  changed_when: true
  when:
    - not ansible_check_mode
    - network_file is changed
    - network_networkd.status.ActiveState == 'active' and network_interfaces is not changed

- name: Reconnect after the network change
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 120
  when: not ansible_check_mode and (network_file is changed or network_interfaces is changed)

- name: Static resolv.conf
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # {{ ansible_managed }}
      {% for s in network_dns %}
      nameserver {{ s }}
      {% endfor %}
      {% if network_dns_search | select | list | length > 0 %}
      search {{ network_dns_search | select | join(' ') }}
      {% endif %}
    mode: "0644"
    follow: false
  when: network_dns | length > 0
