---
- name: Restart valkey
  ansible.builtin.systemd_service:
    name: "{{ valkey_service }}"
    state: restarted
  # Check mode: units/binaries this run would create do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart redis_exporter
  ansible.builtin.systemd_service:
    name: redis_exporter
    state: restarted
    daemon_reload: true
  # Check mode: units/binaries this run would create do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
