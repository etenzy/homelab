---
- name: Group blocky
  ansible.builtin.group:
    name: blocky
    system: true

- name: Look up existing blocky user
  ansible.builtin.getent:
    database: passwd
    key: blocky
    fail_key: false

# The home is only set when the user is created: usermod refuses to change
# the home of a user with running processes (blocky.service).
- name: User blocky
  ansible.builtin.user:
    name: blocky
    group: blocky
    system: true
    shell: /usr/sbin/nologin
    home: "{{ omit if ansible_facts['getent_passwd']['blocky'] is not none else '/var/lib/blocky' }}"
    create_home: false

- name: Config directory
  ansible.builtin.file:
    path: /etc/blocky
    state: directory
    owner: root
    group: blocky
    mode: "0750"

- name: Binary and updater
  ansible.builtin.include_role:
    name: update_binary
  vars:
    update_binary_tool:
      name: blocky
      repo: 0xERR0R/blocky
      # If blocky is this host's resolver, the updater needs DNS to reach GitHub.
      after: blocky.service
      # Restarts drop DNS for a moment: quiet window, not the exporters' slot.
      on_calendar: Sun 04:30
      randomized_delay: 2h

- name: Config from host_files exists
  ansible.builtin.assert:
    that: blocky_config_src is file
    fail_msg: >-
      {{ blocky_config_src }} is missing. Fetch the live config first:
      ansible-playbook fetch-host-files.yml --limit {{ inventory_hostname }}

- name: List directories from host_files
  ansible.builtin.include_tasks: lists.yml
  loop: "{{ blocky_list_dirs }}"
  loop_control:
    loop_var: blocky_list_dir
  when: (host_files_dir ~ blocky_list_dir) is directory

- name: Config (validated with the installed binary)
  ansible.builtin.copy:
    src: "{{ blocky_config_src }}"
    dest: /etc/blocky/config.yml
    owner: root
    group: blocky
    mode: "0640"
    validate: /usr/local/bin/blocky validate --config %s
  notify: Restart blocky

- name: Unit
  ansible.builtin.template:
    src: blocky.service.j2
    dest: /etc/systemd/system/blocky.service
    mode: "0644"
  notify: Restart blocky

# --- Query log maintenance (PostgreSQL) -----------------------------------------
- name: Purge patterns only contain domain characters and %
  ansible.builtin.assert:
    that:
      - blocky_purge_patterns | reject('match', '^[A-Za-z0-9._%-]+$') | list | length == 0
      - blocky_purge_window is match('^[0-9]+ (minutes?|hours?|days?)$')
    fail_msg: "Invalid entries in blocky_purge_patterns or blocky_purge_window."
    quiet: true
  when: blocky_query_log_postgres

- name: Purge SQL directory
  ansible.builtin.file:
    path: /usr/local/lib/blocky
    state: directory
    mode: "0755"
  when: blocky_query_log_postgres

- name: Purge SQL (patterns from the vault)
  ansible.builtin.template:
    src: purge-domains.sql.j2
    dest: /usr/local/lib/blocky/purge-domains.sql
    owner: root
    group: blocky
    # The pattern list is private: readable only for the blocky service user.
    mode: "0640"
  no_log: true
  when: blocky_query_log_postgres and blocky_purge_patterns | length > 0

- name: No purge SQL without patterns
  ansible.builtin.file:
    path: /usr/local/lib/blocky/purge-domains.sql
    state: absent
  when: blocky_query_log_postgres and blocky_purge_patterns | length == 0

- name: Partition maintenance function (SQL file)
  ansible.builtin.template:
    src: log-entries-partitions.sql.j2
    dest: /usr/local/lib/blocky/log-entries-partitions.sql
    owner: root
    group: root
    mode: "0644"
  register: blocky_partition_sql
  when: blocky_query_log_postgres

- name: Look up partition maintenance function
  community.postgresql.postgresql_query:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    query: >-
      SELECT to_regprocedure('public.maintain_log_entries_partitions(integer, interval)')
      IS NOT NULL AS present
  become: true
  become_user: postgres
  check_mode: false
  register: blocky_partition_fn
  when: blocky_query_log_postgres

- name: Create or update partition maintenance function
  community.postgresql.postgresql_script:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    path: /usr/local/lib/blocky/log-entries-partitions.sql
  become: true
  become_user: postgres
  # postgresql_script has no check mode support: skipped in --check runs.
  when:
    - blocky_query_log_postgres
    - blocky_partition_sql is changed or not blocky_partition_fn.query_result[0].present

- name: Maintenance units and timers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - blocky-partitions.service
    - blocky-partitions.timer
    - blocky-purge-domains.service
    - blocky-purge-domains.timer
  when: blocky_query_log_postgres

- name: Run handlers now
  ansible.builtin.meta: flush_handlers

- name: Blocky is running
  ansible.builtin.systemd_service:
    name: blocky
    enabled: true
    state: started
  # Check mode: units/binaries this run would create do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Maintenance timers are active
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  # Check mode: units/binaries this run would create do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  loop: [blocky-partitions.timer, blocky-purge-domains.timer]
  when:
    - blocky_query_log_postgres
    - item != 'blocky-purge-domains.timer' or blocky_purge_patterns | length > 0

- name: Purge timer is off without patterns
  ansible.builtin.systemd_service:
    name: blocky-purge-domains.timer
    enabled: false
    state: stopped
  when: blocky_query_log_postgres and blocky_purge_patterns | length == 0

- name: Blocky answers DNS
  ansible.builtin.command: /usr/local/bin/blocky healthcheck --bindip 127.0.0.1 --port 53
  changed_when: false
  retries: 5
  delay: 3
  register: blocky_health
  until: blocky_health.rc == 0
