---
# Weekly range partitions of blocky's query log table (log_entries) in
# PostgreSQL. Included from main.yml when blocky_query_log_postgres is true,
# before blocky starts. Own tag: --tags blocky_partitions
- name: SQL directory
  ansible.builtin.file:
    path: /usr/local/lib/blocky
    state: directory
    mode: "0755"

- name: Partition storage parameters are plain names and values
  ansible.builtin.assert:
    that:
      - blocky_partition_reloptions.keys() | reject('match', '^[a-z_]+$') | list | length == 0
      - blocky_partition_reloptions.values() | map('string') | reject('match', '^[A-Za-z0-9.]+$') | list | length == 0
    fail_msg: "Invalid entries in blocky_partition_reloptions."
    quiet: true

- name: Partition maintenance function (SQL file)
  ansible.builtin.template:
    src: log-entries-partitions.sql.j2
    dest: /usr/local/lib/blocky/log-entries-partitions.sql
    owner: root
    group: root
    mode: "0644"
  register: blocky_partition_sql

- name: Look up partition maintenance function
  community.postgresql.postgresql_query:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    query: >-
      SELECT to_regprocedure('public.maintain_log_entries_partitions(integer, interval)')
      IS NOT NULL AS present
  become: true
  become_user: postgres
  check_mode: false
  register: blocky_partition_fn

- name: Create or update partition maintenance function
  community.postgresql.postgresql_script:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    path: /usr/local/lib/blocky/log-entries-partitions.sql
  become: true
  become_user: postgres
  # postgresql_script has no check mode support: skipped in --check runs.
  when: blocky_partition_sql is changed or not blocky_partition_fn.query_result[0].present

- name: Initial log_entries schema (SQL file)
  ansible.builtin.template:
    src: log-entries-schema.sql.j2
    dest: /usr/local/lib/blocky/log-entries-schema.sql
    owner: root
    group: root
    mode: "0644"

- name: Look up log_entries table
  community.postgresql.postgresql_query:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    query: >-
      SELECT coalesce((SELECT relkind::text FROM pg_class
                       WHERE oid = to_regclass('public.log_entries')), '') AS relkind
  become: true
  become_user: postgres
  check_mode: false
  register: blocky_log_entries

# Never touches an existing table: migrating an unpartitioned one is manual.
- name: Create partitioned log_entries table
  community.postgresql.postgresql_script:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    path: /usr/local/lib/blocky/log-entries-schema.sql
  become: true
  become_user: postgres
  when: blocky_log_entries.query_result[0].relkind == ''

- name: Create the first partitions
  community.postgresql.postgresql_query:
    login_db: "{{ blocky_db }}"
    login_unix_socket: /run/postgresql
    login_user: blocky
    query: SELECT maintain_log_entries_partitions()
  # As blocky (peer auth), so the partitions are owned by blocky.
  become: true
  become_user: blocky
  # Check mode: the function and table this run would create do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: blocky_log_entries.query_result[0].relkind == ''

- name: Warn about an unpartitioned log_entries table
  ansible.builtin.debug:
    msg: >-
      log_entries exists but is not partitioned (relkind
      {{ blocky_log_entries.query_result[0].relkind }}); the partition timer will
      fail until it is migrated manually.
  when: blocky_log_entries.query_result[0].relkind not in ['', 'p']

- name: Partition maintenance unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [blocky-partitions.service, blocky-partitions.timer]

- name: Partition maintenance timer is active
  ansible.builtin.systemd_service:
    name: blocky-partitions.timer
    enabled: true
    state: started
    daemon_reload: true
  # Check mode: the unit this run would create does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
