---
# Blocky as binary with systemd. The binary comes from update-blocky (weekly
# timer, latest release), the config from host_files/<host>/etc/blocky/config.yml.
blocky_config_src: "{{ host_files_dir }}/etc/blocky/config.yml"
# Local list directories referenced in config.yml. Synced from
# host_files/<host>/<path>: files removed there are removed on the host too.
# Directories missing in host_files are left alone.
blocky_list_dirs:
  - /etc/blocky/allowlists
  - /etc/blocky/denylists
# List changes are reloaded via the API ("blocky lists refresh", host/port taken
# from ports.http in config.yml), without a restart; falls back to a restart.
# Query log in PostgreSQL: maintenance timers for partitions and the domain purge.
blocky_query_log_postgres: true
blocky_db: blocky
# maintain_log_entries_partitions(): weeks created ahead and retention (whole
# weekly partitions are dropped). The daily timer calls it without arguments.
blocky_partition_premake: 4
blocky_partition_retention: 1 year
# Storage parameters set on every partition (a partitioned parent cannot carry
# them). Keys are PostgreSQL table storage parameters; {} sets none.
blocky_partition_reloptions:
  autovacuum_vacuum_insert_scale_factor: 0.05
  autovacuum_vacuum_scale_factor: 0.02
  autovacuum_analyze_scale_factor: 0.01
# Trigram index on question_name for LIKE '%...%' searches (needs pg_trgm).
blocky_query_log_trgm: true
# LIKE patterns (on question_name) whose query log entries are deleted, e.g.
# "%example%" (substring) or "%example.org" (domain and subdomains). Private, so
# they live in host_vars/<host>/vault.yml. Empty list: no purge SQL, timer off.
blocky_purge_patterns: "{{ vault_blocky_purge_patterns | default([]) }}"
# Only entries this recent are touched; must cover the timer interval.
blocky_purge_window: 4 hours
