---
- name: User node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# For scripts that write *.prom files (e.g. update-doh-iplists on sun).
- name: Textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: node_exporter
    mode: "0775"

- name: Unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Binary and updater
  ansible.builtin.include_role:
    name: update_binary
  vars:
    update_binary_tool:
      name: node_exporter
      repo: prometheus/node_exporter

- name: Run handlers now
  ansible.builtin.meta: flush_handlers

- name: Service is running
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
  # Check mode: units/binaries this run would create do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
